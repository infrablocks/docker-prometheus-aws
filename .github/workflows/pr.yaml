name: Pull Request
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        uses: infrablocks/github-actions/asdf_install@v1
      - name: Check
        run: ./go test:code:check
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./go "slack:notify[${{ job.status }}]"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        uses: infrablocks/github-actions/asdf_install@v1
      - name: Ensure docker-compose is available
        run: |
          if ! command -v docker-compose >/dev/null 2>&1; then
            sudo curl -fsSL \
              "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" \
              -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi
      - name: Test
        run: ./go test:integration
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./go "slack:notify[${{ job.status }}]"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  publish-prerelease:
    needs: [check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fork and dependabot PRs don't receive ENCRYPTION_PASSPHRASE, so they
    # can't unlock git-crypt for the Docker Hub credentials.
    if: >-
      github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        uses: infrablocks/github-actions/asdf_install@v1
      - name: Install secrets tools
        run: sudo apt-get update && sudo apt-get install -y git-crypt gnupg
      - name: Unlock git-crypt
        run: ./go git_crypt:unlock_with_encrypted_gpg_key
        env:
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
      - name: Determine image tag
        id: image_tag
        run: >-
          echo "tag=pr-${{ github.event.pull_request.number }}-$(git rev-parse
          --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish pre-release image
        run: ./go image:publish
        env:
          IMAGE_TAGS: ${{ steps.image_tag.outputs.tag }}
      - name: Verify published image
        run: |
          IMAGE="infrablocks/prometheus-aws:${{ steps.image_tag.outputs.tag }}"
          docker image rm "$IMAGE"
          docker pull "$IMAGE"
          docker run --rm --entrypoint /opt/prometheus/bin/prometheus \
            "$IMAGE" --version
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./go "slack:notify[${{ job.status }}]"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  merge-pull-request:
    needs: [check, test]
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
