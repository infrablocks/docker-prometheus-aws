name: Main
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        uses: infrablocks/github-actions/asdf_install@v1
      - name: Check
        run: ./go test:code:check
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./go "slack:notify[${{ job.status }}]"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        uses: infrablocks/github-actions/asdf_install@v1
      - name: Ensure docker-compose is available
        run: ./scripts/ci/common/install-docker-compose.sh
      - name: Test
        run: ./go test:integration
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./go "slack:notify[${{ job.status }}]"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  prerelease:
    needs: [check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialise tag computation between close-together merges. Job-level and
    # queue: max: every queued run is kept, none is cancelled
    concurrency:
      group: main-tags
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        uses: infrablocks/github-actions/asdf_install@v1
      - name: Install secrets tools
        run: ./scripts/ci/common/install-git-crypt.sh
      - name: Unlock git-crypt
        run: ./go git_crypt:unlock_with_encrypted_gpg_key
        env:
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
      - name: Set CI git author
        run: ./go repository:set_ci_author
      - name: Bump version
        run: ./go "version:bump[rc]"
      - name: Publish pre-release image
        run: ./go image:publish
      - name: Notify Slack of release hold
        continue-on-error: true
        run: ./go "slack:notify[success,on_hold]"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./go "slack:notify[${{ job.status }}]"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  release:
    needs: [prerelease]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    # Own group: a run waiting for approval holds this slot for the whole
    # wait, so it must not share prerelease's group or later merges queue
    # behind it
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read # the protection assertion reads the environment
    steps:
      - uses: actions/checkout@v4
        with:
          # Release the commit this run tested and the approver saw, not
          # whatever main is by approval time
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert release environment is protected
        run: ./scripts/ci/common/assert-release-environment-protected.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tools
        uses: infrablocks/github-actions/asdf_install@v1
      - name: Install secrets tools
        run: ./scripts/ci/common/install-git-crypt.sh
      - name: Unlock git-crypt
        run: ./go git_crypt:unlock_with_encrypted_gpg_key
        env:
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
      - name: Set CI git author
        run: ./go repository:set_ci_author
      - name: Release
        run: ./go version:release
      - name: Publish release image
        run: ./go image:publish
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./go "slack:notify[${{ job.status }}]"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
